name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      flavor:
        description: "Build flavor"
        default: production
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed to detect an already-released version.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve build metadata
        id: meta
        run: |
          set -euo pipefail
          FLAVOR="${{ inputs.flavor || 'production' }}"

          # gradle.properties is the single source of truth for the version.
          VERSION_NAME=$(grep -E '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::APP_VERSION_NAME is missing from gradle.properties"
            exit 1
          fi

          # A tag that disagrees with the declared version means one of them is a
          # mistake, and we can't tell which. Fail before burning a build.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$VERSION_NAME" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match APP_VERSION_NAME=${VERSION_NAME} in gradle.properties. Bump the property and re-tag."
              exit 1
            fi
          elif [ "$FLAVOR" = "production" ]; then
            # Re-pushing a tag is blocked by git, but a manual production dispatch
            # would happily ship an already-released version a second time.
            if git rev-parse -q --verify "refs/tags/v${VERSION_NAME}" >/dev/null; then
              echo "::error::Version ${VERSION_NAME} was already released as tag v${VERSION_NAME}. Bump APP_VERSION_NAME before shipping another production build."
              exit 1
            fi
          fi

          {
            echo "flavor=${FLAVOR}"
            echo "task=assemble${FLAVOR^}Release"
            echo "version_name=${VERSION_NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set. See docs/release-distribution.md"
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          PRODUCTION_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
          PRODUCTION_SUPABASE_SECRET_KEY: ${{ secrets.PRODUCTION_SUPABASE_SECRET_KEY }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew ${{ steps.meta.outputs.task }} --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          set -euo pipefail
          OUT_DIR="app/build/outputs/apk/${{ steps.meta.outputs.flavor }}/release"
          # AGP falls back to an "-unsigned" APK instead of failing when no keystore
          # applied. That APK cannot be installed, so never let one reach delivery.
          APK=$(find "$OUT_DIR" -name "*.apk" ! -name "*-unsigned.apk" -type f | head -n 1)
          if [ -z "$APK" ]; then
            if find "$OUT_DIR" -name "*-unsigned.apk" -type f | grep -q .; then
              echo "::error::Build produced only an unsigned APK — the keystore was not applied. Check the RELEASE_KEYSTORE_* secrets."
            else
              echo "::error::No APK produced by ${{ steps.meta.outputs.task }}"
            fi
            exit 1
          fi
          SIZE_MB=$(( $(stat -c%s "$APK") / 1024 / 1024 ))
          echo "Built $APK (${SIZE_MB} MB)"
          # Telegram's Bot API rejects documents larger than 50 MB.
          if [ "$SIZE_MB" -ge 50 ]; then
            echo "::error::APK is ${SIZE_MB} MB, over Telegram's 50 MB limit."
            exit 1
          fi
          {
            echo "path=${APK}"
            echo "size_mb=${SIZE_MB}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload APK to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.flavor }}-release-${{ steps.meta.outputs.version_name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Deliver to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APK: ${{ steps.apk.outputs.path }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          FLAVOR: ${{ steps.meta.outputs.flavor }}
          SIZE_MB: ${{ steps.apk.outputs.size_mb }}
        run: |
          set -euo pipefail
          # AGP names every APK app-<flavor>-release.apk; rename on upload so the
          # customer can tell builds apart in the channel.
          # Staging carries the commit too, since several staging builds can share
          # one version number.
          if [ "$FLAVOR" = "production" ]; then
            FILENAME="CarlosV-${VERSION_NAME}.apk"
          else
            FILENAME="CarlosV-${VERSION_NAME}-${GITHUB_SHA::7}-${FLAVOR}.apk"
          fi

          CAPTION=$(printf '📦 *Nueva versión disponible*\n\nVersión: %s (build %s)\nEntorno: %s\nTamaño: %s MB\nCommit: `%s`' \
            "$VERSION_NAME" "$GITHUB_RUN_NUMBER" "$FLAVOR" "$SIZE_MB" "${GITHUB_SHA::7}")

          HTTP_CODE=$(curl -sS -o /tmp/tg-response.json -w '%{http_code}' \
            -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F "chat_id=${CHAT_ID}" \
            -F "document=@${APK};filename=${FILENAME}" \
            -F "caption=${CAPTION}" \
            -F "parse_mode=Markdown")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Telegram rejected the upload (HTTP ${HTTP_CODE})"
            # Response may echo the request, so surface only Telegram's own error text.
            jq -r '.description // "no description"' /tmp/tg-response.json
            exit 1
          fi
          echo "Delivered $VERSION_NAME to Telegram."
